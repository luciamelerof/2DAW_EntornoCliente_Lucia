<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - leer datos de un formulario</title>
</head>

<body>
    <form id="form" method="post" action="">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre">
        <span class="error" id="err-nombre"></span>

        <br>

        <label for="apellidos">Apellidos: </label>
        <input type="text" id="apellidos" name="apellidos">
        <span class="error" id="err-apellidos"></span>

        <br>

        <label for="email">Email: </label>
        <input type="email" id="email" name="email">
        <span class="error" id="err-email"></span>

        <br>

        <label for="edad">Edad: </label>
        <input type="number" id="edad" name="edad">
        <span class="error" id="err-edad"></span>

        <br>

        <button id="mostrarDatos" type="button">Mostrar datos</button>

        <div>
            <p id="datos"></p>
        </div>
    </form>
    <script src="./datos.js"></script>
</body>

</html>
