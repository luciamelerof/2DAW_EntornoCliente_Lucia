<form method="get" action="" name="myForm" id="myForm">
    <label for="campo1">Nombre: </label>
    <input type="text" name="nombre" id="campo1">
    <br>
    <div id="cajaBotones">
        <label><input type="radio" name="sexo" value="H"> Hombre</label>
        <label><input type="radio" name="sexo" value="M"> Mujer</label>
    </div>
    <br>
    <label for="nuevoSexo">Indica otro sexo: </label>

        <input type="checkbox" name="aficiones" value="cine" id="cine">CINE
