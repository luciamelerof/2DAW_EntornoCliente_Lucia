<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de empleados</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <form method="get" id="formEmpleado" name="formEmpleado">
        <h1>Alta de empleado</h1>

        <div class="campo">
            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" placeholder="12345678Z" maxlength="9">
            <span class="error" id="err-dni"></span>
        </div>

        <div class="fila">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">
                <span class="error" id="err-nombre"></span>
            </div>
            <div class="campo">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos">
                <span class="error" id="err-apellidos"></span>
            </div>
        </div>

        <div class="fila">
            <div class="campo">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad">
                <span class="error" id="err-edad"></span>
            </div>
            <div class="campo">
                <label for="fechaNac">Fecha de nacimiento</label>
                <input type="text" id="fechaNac" name="fechaNac" placeholder="DD/MM/AAAA" maxlength="10">
                <span class="error" id="err-fechaNac"></span>
            </div>
        </div>

        <fieldset>
            <legend>Tipo de empleado</legend>
            <label><input type="radio" name="tipo" value="directivo"> Directivo</label>
            <label><input type="radio" name="tipo" value="encargado"> Encargado</label>
            <label><input type="radio" name="tipo" value="operativo"> Operativo</label>
            <span class="error" id="err-tipo"></span>
        </fieldset>

        <fieldset>
            <legend>Departamento/s</legend>
            <label><input type="checkbox" name="departamentos" value="rrhh"> RR. HH.</label>
            <label><input type="checkbox" name="departamentos" value="ventas"> Ventas</label>
            <label><input type="checkbox" name="departamentos" value="it"> IT</label>
            <label><input type="checkbox" name="departamentos" value="logistica"> Logística</label>
            <span class="error" id="err-departamentos"></span>
        </fieldset>

        <div class="botones">
            <button type="reset">Limpiar</button>
            <button type="submit">Dar de alta</button>
        </div>

        <p id="resultado"></p>
    </form>

    <div id="lista">
        <table>
            <thead>
                <tr>
                    <th>DNI</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Edad</th>
                    <th>F. Nac.</th>
                    <th>Tipo</th>
                    <th>Departamentos</th>
                </tr>
            </thead>
            <tbody id="listaEmpleados"></tbody>
        </table>
    </div>

    <script src="./clase.js"></script>
    <script src="./ejercicio.js"></script>
</body>

</html>
