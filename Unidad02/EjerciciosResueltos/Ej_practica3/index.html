<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 3- Alta gimnasio</title>
</head>

<body>
    <form id="form" method="get" action="">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre">
        <span class="error" id="err-nombre"></span>

        <br>

        <label for="email">Email: </label>
        <input type="text" id="email" nombre="email">
        <span class="error" id="err-email"></span>

        <br>

        <label for="codigoPostal">Código postal: </label>
        <input type="text" id="codigoPostal" name="codigoPostal">
        <span class="error" id="err-codigopostal"></span>

        <br>

        <label for="contrasena">Contraseña (mín 8 caracteres, 1 mayúsc y un núm): </label>
        <input type="password" id="contrasena" name="contrasena">
        <span class="error" id="err-contrasena"></span>

        <br>

        <label for="repetirContrasena">Repite la contraseña: </label>
        <input type="password" id="repetirContrasena" name="repetirContrasena">
        <span class="error" id="err-repetirContrasena"></span>

        <br>

        <label for="edad">Edad: </label>
        <input type="number" id="edad" name="edad">
        <span class="error" id="err-edad"></span>

        <br>

        <label for="actividad">Actividad:</label>
        <select id="actividad" name="actividad">
            <option value="">-- Elige --</option>
            <option value="musculacion">Musculación</option>
            <option value="spinning">Spinning</option>
            <option value="yoga">Yoga</option>
        </select>
        <span class="error" id="err-actividad"></span>

        <br>

        <fieldset>
            <legend>Modalidad</legend>
            <label><input type="radio" name="modalidad" value="manana">Mañana</label>
            <label><input type="radio" name="modalidad" value="tarde">Tarde</label>
            <label><input type="radio" name="modalidad" value="completa">Completa</label>
        </fieldset>
        <span class="error" id="err-modalidad"></span>

        <br>

        <fieldset>
            <legend>Días</legend>
            <label><input type="checkbox" name="dias" value="lunes">Lunes</label>
            <label><input type="checkbox" name="dias" value="martes">Martes</label>
            <label><input type="checkbox" name="dias" value="miercoles">Miercoles</label>
            <label><input type="checkbox" name="dias" value="jueves">Jueves</label>
            <label><input type="checkbox" name="dias" value="viernes">Viernes</label>
            <label><input type="checkbox" name="dias" value="sabado">Sabado</label>
            <label><input type="checkbox" name="dias" value="domingo">Domingo</label>
        </fieldset>
        <span class="error" id="err-dias"></span>

        <br>

        <label for="condiciones">Condiciones:
            <input type="checkbox" name="condiciones">He leído y acepto las condiciones
        </label>
        <span class="error" id="err-condiciones"></span>

        <br>
        
        <button type="submit" id="btnEnviar">Enviar formulario</button>
    </form>
    <script src="./reglas.js"></script>
</body>

</html>
