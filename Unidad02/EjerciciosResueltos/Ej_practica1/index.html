<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Mesa - 1</title>
</head>

<body>
    <form id="form" method="get" action="">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre">
        <span class="error" id="err-nombre"></span>

        <br>

        <label for="telefono">Teléfono: </label>
        <input type="text" id="telefono" name="telefono">
        <span class="error" id="err-telefono"></span>

        <br>

        <label for="nPersonas">Número de personas: </label>
        <input type="number" id="nPersonas" name="nPersonas">
        <span class="error" id="err-npersonas"></span>

        <br>

        <label for="fecha">Fecha: </label>
        <input type="date" id="fecha" name="fecha">
        <span class="error" id="err-fecha"></span>

        <br>

        <fieldset>
            <legend>Turno</legend>
            <label><input type="radio" id="comida" name="turno" value="comida">Comida</label>
            <label><input type="radio" id="cena" name="turno" value="cena">Cena</label>
            <span class="error" id="err-turno"></span>
        </fieldset>

        <br>

        <fieldset>
            <legend>Alergias</legend>
            <span id="cajaAlergias">
                <label><input type="checkbox" id="gluten" name="alergia" value="gluten">Gluten</label>
                <label><input type="checkbox" id="lactosa" name="alergia" value="lactosa">Lactosa</label>
            </span>

            <br>

            <input type="text" id="anadirAlergia" name="anadirAlergia" placeholder="Tu alergia">
            <button type="button" id="anadir">Añadir</button>
            <span class="error" id="err-alergias"></span>
        </fieldset>

        <br>

        <button id="btnEnviar" type="submit">Enviar</button>
    </form>

    <p id="resumen"></p>

    <script src="reserva.js"></script>
</body>

</html>
