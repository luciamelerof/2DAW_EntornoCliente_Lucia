<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ej3 - Radios dinámicos</title>
</head>
<body>
    <form id="myForm" name="myForm" method="get" action="">
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre">
        <br><br>

        <div id="cajaBR">
            <input type="radio" name="sexo" value="H"> Hombre
            <input type="radio" name="sexo" value="M"> Mujer
        </div>
        <br>

        <label for="nuevoSexo">Otra opción:</label>
        <input type="text" name="nuevoSexo" id="nuevoSexo">
        <!-- type="button": NO envía el formulario -->
        <button type="button" id="bAnadir">Añadir</button>
        <br><br>

        Aficiones (mínimo una):
        <input type="checkbox" name="aficiones" value="cine"> CINE
        <input type="checkbox" name="aficiones" value="teatro"> TEATRO
        <input type="checkbox" name="aficiones" value="deportes"> DEPORTES
        <br><br>

        <button type="submit">Enviar</button>
    </form>

    <div id="resultado"></div>

    <script src="codigo.js"></script>
</body>
</html>
